{% extends 'base/base.html' %}

{% block title %} Resend Verification {% endblock title %}

{% block content %}
<section class="section py-5">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-6">
        <h3 class="mb-4 text-center">Resend Verification Email</h3>
        <form method="post">
          {% csrf_token %}
          <div class="form-group">
            <label for="email">Enter Your Email</label>
            <input class="form-control" type="email" name="email" required>
          </div>
          <button class="btn btn-warning btn-block mt-3" type="submit">Resend</button>
        </form>
      </div>
    </div>
  </div>
</section>
{% endblock content %}
